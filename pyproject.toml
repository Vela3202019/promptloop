[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptloop"
version = "0.1.0"
description = "Interactive agent for the full prompt eval loop: create, run, report, improve."
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents>=0.4.11",
    "langchain>=1.2.12",
    "langchain-core>=1.2.19",
    "langchain-anthropic>=1.3.5",
    "langchain-openai>=0.3.0",
    "langgraph>=1.1.2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "rich>=14.0.0",
    "jsonschema>=4.0.0",
    "genson>=1.3.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
promptloop = "promptloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptloop"]

[dependency-groups]
dev = [
    "basedpyright>=1.36.0",
    "pytest>=8.3.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["I", "UP", "B", "F", "E", "SIM", "BLE", "PIE", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
